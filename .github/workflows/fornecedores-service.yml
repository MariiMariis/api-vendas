name: build fornecedores-service

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instala o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compila o fornecedores-service
        run: mvn -B package --file fornecedores-service/pom.xml
