# Configuracoes do produtos-service, centralizadas no Config Server.
# Este arquivo e' lido pelo config-server a partir do repositorio Git
# e servido ao produtos-service quando ele sobe (spring.config.import=configserver:...).

server.port=8081

server.error.include-message=always

jwt.secret=00d23b30-8bd5-4cfa-935c-9305be24d5f7

spring.r2dbc.url=r2dbc:postgresql://localhost:5434/produtosdb
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres
spring.sql.init.mode=always

# Registro no Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
