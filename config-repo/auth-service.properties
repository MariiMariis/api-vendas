# Configuracoes do auth-service, centralizadas no Config Server.

server.port=8084

server.error.include-message=always

jwt.secret=00d23b30-8bd5-4cfa-935c-9305be24d5f7
jwt.access-expiration=2m
jwt.refresh-expiration=30m

spring.datasource.url=jdbc:postgresql://localhost:5433/authdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.sql.init.mode=always

auth.demo.nome=Mariana Motta
auth.demo.email=mariana.motta@al.infnet.edu.br
auth.demo.senha=admin123

# Registro no Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
