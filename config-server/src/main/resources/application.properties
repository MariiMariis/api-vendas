server.port=8888

spring.application.name=config-server

# Backend "native": le os .properties direto da pasta config-repo, sem exigir
# repositorio Git. Os dois caminhos cobrem rodar a partir da raiz do projeto
# ou de dentro de config-server/ -- nao ha caminho fixo de nenhuma maquina.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:./config-repo,file:../config-repo
